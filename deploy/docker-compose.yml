# Этап 0 (S0-1): caddy, web, api, postgres; этап 1 (S1-2): + worker.
# Состав растёт по этапам —
# docs/architecture/02-services.md. TLS-край — host-nginx (ADR-004),
# caddy опубликован только на 127.0.0.1:${HTTP_PORT}.

name: lingua

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    <<: *logging
    ports:
      - "127.0.0.1:${HTTP_PORT:-8090}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../web
    restart: unless-stopped
    <<: *logging
    environment:
      # Server Components ходят в api напрямую по compose-сети (web/lib/api.ts)
      INTERNAL_API_URL: http://api:8080
    # SSR-страницы рендерятся через api, поэтому web стартует после него
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: ../backend
      target: api
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DOMAIN: ${DOMAIN}
      # S1-4: без ключей комната урока отдаёт 503, остальное работает
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # S1-3/S1-5: хранилище записей (R2, ADR-009). Без ключей api живёт,
      # но /media/{id}/url отвечает 503, а запись не запускается
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # 1 — писать только звук (дешевле, для транскрипта достаточно)
      EGRESS_AUDIO_ONLY: ${EGRESS_AUDIO_ONLY:-}
      # S1-1: Google Calendar (ADR-023); без ключей подключение отвечает 503
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # S1-2: фоновые джобы из таблицы jobs (ADR-003, ADR-013). Портов нет:
  # worker только ходит в postgres. Healthcheck не заведён — HTTP у worker'а
  # нет, а упавший процесс поднимет restart.
  worker:
    build:
      context: ../backend
      target: worker
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # S1-1: calendar_sync (ADR-023); без ключей джобы снимаются со строкой
      # в журнале, DOMAIN — для ссылки на урок в описании события
      DOMAIN: ${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
    # После SIGTERM текущей джобе даётся 20 с (jobs.Config.ShutdownGrace);
    # docker по умолчанию ждёт 10 — берём с запасом до SIGKILL
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Для make seed (S0-3): пароль seed-пользователей, опционален
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Инструмент миграций (S0-2+): make migrate → docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    <<: *logging
    volumes:
      - ../backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
