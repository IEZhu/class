name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.76.1
          cache: false
      - name: Scan all locked dependencies and source secrets
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          trivy fs --config '' --ignorefile '' --ignore-policy '' --secret-config '' \
            --scanners vuln,secret --pkg-types os,library --detection-priority comprehensive \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false \
            --include-dev-deps --list-all-pkgs --format json --output "$RUNNER_TEMP/source-scan.json" --exit-code 1 .
          python3 scripts/check_scan_inventory.py "$RUNNER_TEMP/source-scan.json" source

  images:
    name: Runtime image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, caddy, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.76.1
          cache: false
      - name: Build or pull the actual Compose runtime image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            api) docker build --pull -t security-scan:ci backend ;;
            web) docker build --pull -t security-scan:ci web ;;
            caddy|postgres)
              ref=$(docker compose -f deploy/docker-compose.yml config --format json --no-interpolate | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"][sys.argv[1]]["image"])' "$IMAGE")
              docker pull "$ref"
              docker tag "$ref" security-scan:ci
              ;;
            *) exit 1 ;;
          esac
      - name: Block every runtime vulnerability, including unfixed findings
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          trivy image --config '' --ignorefile '' --ignore-policy '' \
            --scanners vuln --pkg-types os,library --detection-priority comprehensive \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false \
            --list-all-pkgs --format json --output "$RUNNER_TEMP/image-scan.json" \
            --image-src docker --timeout 15m --exit-code 1 security-scan:ci
          python3 scripts/check_scan_inventory.py "$RUNNER_TEMP/image-scan.json" "$IMAGE"
